<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.453.0/dist/umd/lucide.min.js"></script>
<style>
/* 登录页（背景整屏 + 下部渐亮到墙色，按钮离底 58px）；模块首页见 mock-art.html。取值同 02 章设计变量 */
:root{--brand:#b75d45;--ink:#3b2a24;--muted:#7a5a4a;--paper:#fffbf6;--card:#fffbf6db;--bg:#f6ebdf;--hair:#ecd4c6;--line:#f8ebe4;
  --amber:#8a5a1e;--amberBg:#f6e7d2;--r:12px;--gapHome:20px;--serif:"Noto Serif SC","Songti SC",serif}
*{box-sizing:border-box}
body{margin:0;padding:28px;background:#ddd6cd;font-family:-apple-system,"PingFang SC",sans-serif}
.set{display:flex;gap:24px;align-items:flex-start}
.col{display:flex;flex-direction:column;align-items:center;gap:10px}.col>p{margin:0;font-size:14px;color:#3a302b}
.phone{position:relative;width:390px;height:844px;overflow:hidden;border-radius:40px;box-shadow:0 10px 30px rgba(0,0,0,.14);background:var(--bg);color:var(--ink)}
.bgimg{position:absolute;inset:0;width:100%;height:100%}
.fade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(246,235,223,0) 52%,var(--bg) 88%)}
.lucide{stroke-width:1.4}
.status{position:absolute;top:0;left:0;right:0;height:47px;display:flex;justify-content:space-between;align-items:center;padding:0 26px 0 34px;font-size:16px;font-weight:600;color:#1f1a17}
.status .lucide{width:17px;height:17px;stroke-width:2;margin-left:4px}
.capsule{position:absolute;top:51px;right:10px;width:87px;height:32px;border-radius:16px;background:rgba(255,255,255,.7);border:1px solid rgba(0,0,0,.07)}
.hi{position:absolute;bottom:8px;left:50%;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:#1a1a1a}
/* 登录 */
.logo{position:absolute;top:250px;left:0;right:0;display:flex;justify-content:center}.logo img{height:46px}
.login{position:absolute;left:var(--gapHome);right:var(--gapHome);bottom:58px;display:flex;flex-direction:column;gap:16px}
.agree{display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;font-size:12px;color:var(--muted)}
.agree i{width:18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--muted)}.agree u{color:var(--ink);text-decoration-color:var(--brand);text-underline-offset:3px}
.btn{height:44px;display:flex;align-items:center;justify-content:center;border-radius:var(--r);background:var(--brand);color:#fff;font-size:15px;font-weight:600;letter-spacing:.16em}
</style></head><body>
<script>
const ic = (n, c = '') => `<i data-lucide="${n}" class="${c}"></i>`;
const bar = `<div class="status"><span>9:41</span><span>${ic('signal')}${ic('wifi')}${ic('battery-full')}</span></div><div class="capsule"></div>`;
const img = `<img class="bgimg" src="../../miniapp/miniprogram/assets/backdrop.jpg">`;
const login = `<div class="phone">${img}<div class="fade"></div>${bar}<div class="logo"><img src="logo.png" alt="花众"></div>
  <div class="login"><div class="agree"><i></i><span>我已阅读并同意<u>《花众隐私保护指引》</u></span></div><div class="btn">手机号快速验证登录</div></div><div class="hi"></div></div>`;
const col = (h, t) => `<div class="col">${h}<p>${t}</p></div>`;
document.body.innerHTML = `<div class="set">${col(login, '登录页（full + 下部渐亮）')}</div>`;
lucide.createIcons();
</script>
</body></html>
