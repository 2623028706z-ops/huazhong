<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.453.0/dist/umd/lucide.min.js"></script>
<style>
/* 主色用 logo 红：红只上 logo、图标、按钮底、选中线；小字一律用墨色，状态用柔和的琥珀、绿、灰 */
:root{--wall:#f6ebdf;--card:rgba(255,251,246,.86);--cardSolid:#fffbf6;--brand:#b75d45;--brandTint:rgba(183,93,69,.1);
  --ink:#3b2a24;--muted:#7a5a4a;--rule:rgba(183,93,69,.16);--r:12px;--sw:1.4;
  --amber:#8a5a1e;--amberBg:#f6e7d2;--green:#4c6a48;--greenBg:#e7ecdf;--grey:#6f665f;--greyBg:#eeeae5;--hair:#ecd4c6;--ri:9px;--serif:"Noto Serif SC","Songti SC",serif}
body{margin:0;padding:28px;background:#ddd6cd;font-family:-apple-system,"PingFang SC",sans-serif}
.set{display:flex;gap:24px;align-items:flex-start}
.col{display:flex;flex-direction:column;align-items:center;gap:10px}.col>p{margin:0;font-size:14px;color:#3a302b}
.phone{position:relative;width:390px;height:844px;overflow:hidden;border-radius:40px;box-shadow:0 10px 30px rgba(0,0,0,.14);background:var(--wall);color:var(--ink)}
.lucide{stroke-width:var(--sw)}
.status{position:absolute;top:0;left:0;right:0;height:47px;display:flex;justify-content:space-between;align-items:center;padding:0 26px 0 34px;font-size:16px;font-weight:600;color:#1f1a17}
.status .lucide{width:17px;height:17px;stroke-width:2;margin-left:4px}
.capsule{position:absolute;top:51px;right:10px;width:87px;height:32px;border-radius:16px;background:rgba(255,255,255,.7);border:1px solid rgba(0,0,0,.07)}
.hi{position:absolute;bottom:8px;left:50%;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:#1a1a1a}
/* 列表：左右 16px；搜索 → 状态分段 → 日期分段 → 对象格子 → 三行卡片 → 底部操作区 */
.nav{position:absolute;top:47px;left:0;right:0;height:44px;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:600;font-size:17px;letter-spacing:.1em}
.nav .lucide{position:absolute;left:12px;width:22px;height:22px}
.body{position:absolute;top:100px;left:16px;right:16px;display:flex;flex-direction:column;gap:8px}
.search{display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:var(--r);background:var(--card);font-size:14px;color:var(--muted)}
.search .lucide{width:17px;height:17px}
.hbox{display:flex;gap:8px}.hbox .search{flex:1}
.fbtn{position:relative;width:44px;height:44px;flex:none;border-radius:var(--r);background:var(--card);display:grid;place-items:center}
.fbtn .dot{position:absolute;top:10px;right:10px;width:6px;height:6px;border-radius:3px;background:var(--brand)}
.tabs{display:flex;align-items:stretch;gap:12px;height:40px;padding:0;font-size:14px;color:var(--muted);border-bottom:1px solid var(--hair)}
.tabs span{position:relative;display:flex;align-items:center;white-space:nowrap}.tabs span i{margin-left:3px;font-style:normal;font-size:12px}
.tabs .on{color:var(--ink);font-weight:600}.tabs .on:after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--brand)}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:flex;align-items:center;gap:2px;height:28px;padding:0 4px 0 10px;border-radius:14px;background:var(--cardSolid);box-shadow:inset 0 0 0 1px var(--hair);font-size:12px}
.chip .lucide{width:14px;height:14px;color:var(--muted)}
.clear{font-size:12px;font-weight:600;text-decoration:underline;text-decoration-color:var(--brand);text-underline-offset:4px}
.lc{background:var(--card);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px;margin-top:2px}
.lc div{display:flex;align-items:center;gap:8px}.lc .r2 b{flex:1;font-weight:500;font-size:15px}
.lc .r1{font-size:12px;color:var(--muted);justify-content:space-between}.lc .r3{font-size:12px;color:var(--muted)}.lc .r3 em{margin-left:auto;font-style:normal;font-weight:600;font-size:15px;color:var(--ink)}
.tag{font-size:11px;line-height:20px;padding:0 8px;border-radius:10px}
.tag.wait{background:var(--amberBg);color:var(--amber)}.tag.done{background:var(--greenBg);color:var(--green)}.tag.end{background:var(--greyBg);color:var(--grey)}
.abar{position:absolute;left:0;right:0;bottom:0;padding:9px 14px 34px;background:var(--cardSolid)}
.btn{height:44px;display:flex;align-items:center;justify-content:center;border-radius:var(--r);background:var(--brand);color:#fff;font-size:15px;font-weight:600;letter-spacing:.16em}
</style></head><body>
<script>
const ic = (n, c = '') => `<i data-lucide="${n}" class="${c}"></i>`;
const bar = `<div class="status"><span>9:41</span><span>${ic('signal')}${ic('wifi')}${ic('battery-full')}</span></div><div class="capsule"></div>`;
// [出货日期, 状态, 颜色, 客户 · 门店, 总数, 单号, 金额]
const ORDERS = [['09-30', '待确认', 'wait', '静安花艺工作室 · 静安店', '共 32 束', 'SO-260930-012', '3,860.00'], ['09-30', '待发货', 'wait', '南京西路 · 繁花', '共 12 束', 'SO-260930-011', '1,240.00'], ['09-29', '已发货', 'done', '云间花事 · 徐汇店', '共 58 束', 'SO-260929-038', '6,512.50'], ['09-29', '已取消', 'end', '花与器 FLORA', '共 12 束', 'SO-260929-031', '2,305.00'], ['09-28', '已发货', 'done', '兰亭婚礼策划', '共 96 束', 'SO-260928-027', '12,800.00']];
// 筛选栏方案丙：搜索 + 筛选按钮 → 状态标签（等待类带数）→ 设了条件才出胶囊
const statusTabs = on => `<div class="tabs">${['全部', '待确认<i>2</i>', '待发货<i>3</i>', '已发货', '已取消'].map((t, k) => `<span class="${k === on ? 'on' : ''}">${t}</span>`).join('')}</div>`;
const list = `<div class="phone">${bar}<div class="nav">${ic('chevron-left')}销售订单</div>
  <div class="body"><div class="hbox"><div class="search">${ic('search')}搜索单号、客户、门店</div><span class="fbtn">${ic('sliders-horizontal')}<i class="dot"></i></span></div>
  ${statusTabs(0)}
  <div class="chips"><span class="chip">近 7 天${ic('x')}</span><span class="chip">静安花艺工作室${ic('x')}</span><span class="clear">清除</span></div>
  ${ORDERS.map(([d, st, c, obj, qty, no, amt]) => `<div class="lc"><div class="r1"><span>${d}</span><span class="tag ${c}">${st}</span></div><div class="r2"><b>${obj}</b><span style="font-size:12px;color:var(--muted)">${qty}</span></div><div class="r3"><span>${no}</span><em>¥${amt}</em></div></div>`).join('')}</div>
  <div class="abar"><div class="btn">新建订单</div></div><div class="hi"></div></div>`;
const col = (h, t) => `<div class="col">${h}<p>${t}</p></div>`;
document.body.innerHTML = `<div class="set">${col(list, '列表（销售订单，左右 16px）；首页和「我的」见 mock-art.html')}</div>`;
lucide.createIcons();
</script>
</body></html>
