<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/lucide@0.453.0/dist/umd/lucide.min.js"></script>
<style>
/* 花众 · 窗：首页和「我的」同一面墙、同一套卡片；logo 用花众正式字标 */
:root{--wall:#f6ebdf;--card:rgba(255,251,246,.86);--cardSolid:#fffbf6;--brand:#b75d45;--brandTint:rgba(183,93,69,.1);
  --ink:#3b2a24;--muted:#7a5a4a;--rule:rgba(183,93,69,.16);--onBrand:#fff8f0;--r:12px;--sw:1.4}
body{margin:0;padding:28px;background:#ddd6cd;font-family:-apple-system,"PingFang SC",sans-serif}
.set{display:flex;gap:24px;align-items:flex-start}
.col{display:flex;flex-direction:column;align-items:center;gap:10px}
.col>p{margin:0;font-size:14px;color:#3a302b;letter-spacing:.08em}
.phone{position:relative;width:390px;height:844px;overflow:hidden;border-radius:40px;box-shadow:0 10px 30px rgba(0,0,0,.14);background:var(--wall);color:var(--ink)}
.bgimg{position:absolute;inset:0;width:100%;height:100%}
.lucide{stroke-width:var(--sw)}
.status{position:absolute;top:0;left:0;right:0;height:47px;display:flex;justify-content:space-between;align-items:center;padding:0 26px 0 34px;font-size:16px;font-weight:600;color:#1f1a17}
.status .lucide{width:17px;height:17px;stroke-width:2;margin-left:4px}
.capsule{position:absolute;top:51px;right:10px;width:87px;height:32px;border-radius:16px;background:rgba(255,255,255,.7);border:1px solid rgba(0,0,0,.07)}
.head{position:absolute;top:100px;left:20px;right:20px}
.head img{display:block;height:38px;margin-left:2px}
.id{display:flex;align-items:baseline;justify-content:space-between;margin-top:16px;font-size:13px}
.id b{font-weight:600}.id .who{color:var(--ink)}.id .who span{color:var(--muted)}
.id time{color:var(--muted);font-size:12px}
.grid{position:absolute;left:20px;right:20px;top:208px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cell{position:relative;height:112px;border-radius:var(--r);background:var(--card);padding:18px 16px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between}
.cell .lucide{width:28px;height:28px;color:var(--brand)}
.cell b{font-weight:600;font-size:16px;letter-spacing:.12em}
.cell .go{position:absolute;right:14px;bottom:18px;width:16px;height:16px;color:var(--muted)}
.cell.wide{grid-column:1/3;height:72px;flex-direction:row;align-items:center;justify-content:flex-start;gap:18px}
.cell.wide .go{bottom:28px}
.tab{position:absolute;left:0;right:0;bottom:0;height:84px;display:flex;background:var(--cardSolid);border-top:1px solid var(--rule)}
.tab span{flex:1;display:flex;flex-direction:column;align-items:center;padding-top:10px;gap:4px;font-size:11px;color:var(--muted)}
.tab .lucide{width:24px;height:24px}.tab .on{color:var(--ink);font-weight:600}.tab .on .lucide{color:var(--brand)}
.hi{position:absolute;bottom:8px;left:50%;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:#1a1a1a}
/* 我的：身份卡 → 入口卡 → 退出登录 */
.me{position:absolute;left:20px;right:20px;top:208px}
.profile{display:flex;align-items:center;gap:14px;padding:18px 16px;border-radius:var(--r);background:var(--card)}
.avatar{width:48px;height:48px;border-radius:50%;background:var(--brandTint);color:var(--brand);display:grid;place-items:center;font-family:"Noto Serif SC",serif;font-size:20px;font-weight:600}
.profile b{display:block;font-family:"Noto Serif SC",serif;font-weight:600;font-size:18px;letter-spacing:.1em}
.profile small{display:block;margin-top:4px;font-size:12px;color:var(--muted)}
.menu{margin-top:12px;border-radius:var(--r);background:var(--card);padding:0 16px}
.menu div{display:flex;align-items:center;gap:12px;height:54px;font-size:15px}
.menu div+div{border-top:1px solid var(--rule)}
.menu .lucide{width:20px;height:20px;color:var(--brand)}
.menu .go{margin-left:auto;width:16px;height:16px;color:var(--muted)}
.out{margin-top:24px;height:46px;display:flex;align-items:center;justify-content:center;border-radius:var(--r);border:1px solid var(--rule);font-size:15px;letter-spacing:.2em;color:var(--ink)}

/* 外部端首页：一张主卡（最常做的事）+ 一排次卡 */
.hero{position:absolute;left:20px;right:20px;top:208px;height:150px;box-sizing:border-box;padding:20px 18px;border-radius:var(--r);background:var(--card);display:flex;flex-direction:column;justify-content:space-between}
.hero .lucide{width:32px;height:32px;color:var(--brand)}
.hero b{font-family:"Noto Serif SC",serif;font-weight:600;font-size:22px;letter-spacing:.2em}
.hero small{display:block;margin-top:6px;font-size:13px;color:var(--muted)}
.hero .go{position:absolute;right:16px;bottom:22px;width:18px;height:18px;color:var(--muted)}
.badge{position:absolute;top:18px;right:16px;min-width:22px;padding:0 9px;box-sizing:border-box;line-height:22px;border-radius:11px;background:var(--brand);color:var(--onBrand);font-size:12px;text-align:center}
.minis{position:absolute;left:20px;right:20px;top:370px;display:grid;gap:12px}
.mini{height:100px;box-sizing:border-box;padding:16px;border-radius:var(--r);background:var(--card);display:flex;flex-direction:column;justify-content:space-between}
.mini .lucide{width:24px;height:24px;color:var(--brand)}
.mini b{font-weight:600;font-size:15px;letter-spacing:.12em}
.tab span{position:relative}
.tab i.n{position:absolute;top:5px;left:50%;margin-left:6px;min-width:16px;padding:0 4px;box-sizing:border-box;line-height:16px;border-radius:8px;background:var(--brand);color:var(--onBrand);font-size:10px;font-style:normal;text-align:center}
</style></head><body>
<script>
const ic = (n, c = '') => `<i data-lucide="${n}" class="${c}"></i>`;
const chrome = `<img class="bgimg" src="../../miniapp/miniprogram/assets/backdrop.jpg"><div class="status"><span>9:41</span><span>${ic('signal')}${ic('wifi')}${ic('battery-full')}</span></div><div class="capsule"></div>`;
const head = who => `<div class="head"><img src="logo.png" alt="花众"><div class="id"><span class="who">${who}</span><time>2026.09.30 周三</time></div></div>`;
const tabs = (items, on) => `<div class="tab">${items.map(([n, i, badge], k) => `<span class="${k === on ? 'on' : ''}">${ic(i)}${badge ? `<i class="n">${badge}</i>` : ''}${n}</span>`).join('')}</div><div class="hi"></div>`;
const hero = (icon, name, sub, badge) => `<div class="hero">${badge ? `<span class="badge">${badge}</span>` : ''}${ic(icon)}<div><b>${name}</b><small>${sub}</small></div>${ic('chevron-right', 'go')}</div>`;
const minis = list => `<div class="minis" style="grid-template-columns:repeat(${list.length},1fr)">${list.map(([n, i]) => `<div class="mini">${ic(i)}<b>${n}</b></div>`).join('')}</div>`;
const STORE_TABS = [['首页', 'house'], ['购物车', 'shopping-cart', 3], ['我的', 'user']];
const SUP_TABS = [['首页', 'house'], ['填报', 'clipboard-pen', 3], ['我的', 'user']];
const store = `<div class="phone">${chrome}${head('<b>晨曦花艺 · 滨江店</b> <span>· 陈女士</span>')}
  ${hero('shopping-bag', '订货', '今日可订 128 款')}${minis([['订单', 'file-text'], ['售后', 'rotate-ccw'], ['对账', 'notebook-text']])}${tabs(STORE_TABS, 0)}</div>`;
const supplier = `<div class="phone">${chrome}${head('<b>春禾花材</b> <span>· 林先生</span>')}
  ${hero('clipboard-pen', '填报', '3 份邀请待填报', 3)}${minis([['采购单', 'file-text'], ['对账', 'notebook-text']])}${tabs(SUP_TABS, 0)}</div>`;
const storeMe = `<div class="phone">${chrome}${head('<b>晨曦花艺 · 滨江店</b> <span>· 陈女士</span>')}
  <div class="me"><div class="profile"><div class="avatar">陈</div><div><b>陈女士</b><small>晨曦花艺 · 滨江店 · 139****0002</small></div></div>
  <div class="menu"><div>${ic('id-card')}个人资料${ic('chevron-right', 'go')}</div></div>
  <div class="out">退出登录</div></div>${tabs(STORE_TABS, 2)}</div>`;
const col = (html, label) => `<div class="col">${html}<p>${label}</p></div>`;
document.body.innerHTML = `<div class="set">${col(store, '门店首页（设计稿）')}${col(storeMe, '门店 · 我的')}${col(supplier, '供应商首页（设计稿）')}</div>`;
lucide.createIcons();
</script>
</body></html>
