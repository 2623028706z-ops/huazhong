# 本地开发用的 PostgreSQL（01 章第 5 节）。接口测试不用它，测试自己起容器（Testcontainers）
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: huazhong
      POSTGRES_PASSWORD: huazhong
      POSTGRES_DB: huazhong
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
